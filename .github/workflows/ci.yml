name: React todo app CI

on:
  push:
    branches: [main]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v3

      - name: setup nodejs
        uses: actions/setup-node@v4
        with:
         node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build
        
  
